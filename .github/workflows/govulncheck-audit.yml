name: govulncheck audit (temporary)
on:
  workflow_dispatch:
  push:
    branches: [audit-govulncheck]
jobs:
  scan-go124:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && cp "$(go env GOPATH)/bin/govulncheck" "$RUNNER_TEMP/"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: govulncheck with the Go 1.24 standard library
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          "$RUNNER_TEMP/govulncheck" ./... > out.txt 2>&1 || true
          cat out.txt
          summary=$(awk '/^Vulnerability #/{id=$3} /^    [A-Z]/ && id {print id": "$0; id=""}' out.txt | sed 's/  */ /g' | paste -sd'|' -)
          echo "::warning title=go1.24 reachable::${summary}"
          tail -n 3 out.txt | paste -sd' ' - | sed 's/^/::warning title=go1.24 totals::/'
          "$RUNNER_TEMP/govulncheck" -show verbose ./... 2>&1 | grep -E "^Vulnerability #" -A2 | grep -vE "^--" | awk '/^Vulnerability/{id=$3; next} id{print id": "$0; id=""}' | sed 's/  */ /g' | paste -sd'|' - | sed 's/^/::warning title=go1.24 all incl. unreachable::/' 
