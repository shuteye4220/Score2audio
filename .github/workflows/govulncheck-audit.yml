name: govulncheck audit (temporary)
on:
  workflow_dispatch:
  push:
    branches: [audit-govulncheck]
jobs:
  scan-go124:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && cp "$(go env GOPATH)/bin/govulncheck" "$RUNNER_TEMP/"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: govulncheck with the Go 1.24 standard library
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          "$RUNNER_TEMP/govulncheck" ./... > out.txt 2>&1 || true
          cat out.txt
          grep -E "^Vulnerability #|^    [A-Za-z]|Found in:|Fixed in:|^Your code|^No vulnerabilities|more vulnerabilit" out.txt | head -80 | while IFS= read -r l; do echo "::warning title=go1.24::$l"; done
