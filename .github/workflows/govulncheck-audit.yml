name: govulncheck audit (temporary)
on:
  workflow_dispatch:
  push:
    branches: [audit-govulncheck]
jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "1.27"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go install golang.org/x/vuln/cmd/govulncheck@latest
          if ! "$(go env GOPATH)/bin/govulncheck" -show verbose ./... > out.txt 2>&1; then status=fail; fi
          cat out.txt
          grep -E "^(Vulnerability #|  [A-Za-z]|    Found in|    Fixed in|    Example traces)" out.txt | head -60 | while IFS= read -r l; do echo "::warning title=go ${{ matrix.go }}::$l"; done
          grep -E "^Your code is affected by|^No vulnerabilities found|^=== Symbol Results|vulnerabilit" out.txt | head -5 | while IFS= read -r l; do echo "::notice title=go ${{ matrix.go }} summary::$l"; done
