name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache: false
      - name: Check for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > vulncheck.txt 2>&1 || {
            cat vulncheck.txt
            grep -E "^Vulnerability #|^    [A-Z]" vulncheck.txt | head -40 | while IFS= read -r l; do echo "::error title=govulncheck::$l"; done
            exit 1
          }
          cat vulncheck.txt
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi
      - name: Test and build Windows, Mac and Linux downloads
        run: make dist VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # The SHA-256 fingerprint of the project's private signing key.
          # Every published app must be signed with it, or Android would refuse
          # it as an update (and it would not be the real score2audio).
          EXPECTED_CERT_SHA256: 81d60d76fccc52cbfc9b33f1d17aef664c16d013e1bb45c20a4897565d9bfaac
        run: |
          if [ -n "$SIGNING_STORE_BASE64" ]; then
            echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/signing.p12"
            SIGNED=yes; echo "SIGNED=yes" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error title=Android signing::The SIGNING_STORE_BASE64 and SIGNING_STORE_PASSWORD secrets are not set, so this release cannot be signed. See README.md."
            exit 1
          else
            echo "::warning title=Android signing::The signing secrets are not set; building with a throwaway debug key (not published to the builds branch)."
            SIGNED=no; echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
          gradle --no-daemon assembleRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE"
          rm -f "$RUNNER_TEMP/signing.p12"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/score2audio-android.apk
          # Check which key actually signed the app.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cert=$("$apksigner" verify --print-certs ../dist/score2audio-android.apk | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}')
          echo "::notice title=Android signing::Signed with certificate SHA-256 $cert"
          if [ "$SIGNED" = yes ] && [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Android signing::The app was signed with an unexpected key ($cert)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/score2audio-android.apk
      - name: Keep the latest app on the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/builds" && cd "$RUNNER_TEMP/builds"
          cp "$GITHUB_WORKSPACE/dist/score2audio-android.apk" .
          echo "score2audio Android app built from ${GITHUB_SHA} (version ${VERSION})." > README.md
          git init -q -b builds
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Android app built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # the release was made on GitHub's website: add the downloads to it
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRE=""
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" $PRE \
              --title "score2audio ${GITHUB_REF_NAME}" --generate-notes
          fi
