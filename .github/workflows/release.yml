name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Decides the version being built, and whether to publish it as a
  # release: for a pushed tag such as v1.0.1, or when a push to main changes
  # the VERSION file to a version that has no release yet.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(tr -d ' \r\n' < VERSION)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::Building and publishing score2audio $V"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache: false
      - name: Check for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./... > vulncheck.txt 2>&1 || {
            cat vulncheck.txt
            grep -E "^Vulnerability #|^    [A-Z]" vulncheck.txt | head -40 | while IFS= read -r l; do echo "::error title=govulncheck::$l"; done
            exit 1
          }
          cat vulncheck.txt
      - name: Test and build Windows, Mac and Linux downloads
        run: make dist VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: dist/*

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Work out the version code
        run: echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          # The SHA-256 fingerprint of the project's private signing key.
          # Every published app must be signed with it, or Android would refuse
          # it as an update (and it would not be the real score2audio).
          EXPECTED_CERT_SHA256: 81d60d76fccc52cbfc9b33f1d17aef664c16d013e1bb45c20a4897565d9bfaac
        run: |
          if [ -n "$SIGNING_STORE_BASE64" ]; then
            echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            export SIGNING_STORE_FILE="$RUNNER_TEMP/signing.p12"
            SIGNED=yes; echo "SIGNED=yes" >> "$GITHUB_ENV"
          elif [ "$RELEASE" = true ]; then
            echo "::error title=Android signing::The SIGNING_STORE_BASE64 and SIGNING_STORE_PASSWORD secrets are not set, so this release cannot be signed. See README.md."
            exit 1
          else
            echo "::warning title=Android signing::The signing secrets are not set; building with a throwaway debug key (not published to the builds branch)."
            SIGNED=no; echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
          gradle --no-daemon assembleRelease -PappVersion="$VERSION" -PappVersionCode="$VERSION_CODE"
          rm -f "$RUNNER_TEMP/signing.p12"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/score2audio-android.apk
          # Check which key actually signed the app.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          cert=$("$apksigner" verify --print-certs ../dist/score2audio-android.apk | grep -i -m1 "certificate SHA-256 digest" | grep -oiE "[0-9a-f]{64}" | tr 'A-F' 'a-f')
          echo "::notice title=Android signing::Signed with certificate SHA-256 $cert"
          if [ "$SIGNED" = yes ] && [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Android signing::The app was signed with an unexpected key ($cert)."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/score2audio-android.apk
      - name: Keep the latest app on the builds branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/builds" && cd "$RUNNER_TEMP/builds"
          cp "$GITHUB_WORKSPACE/dist/score2audio-android.apk" .
          echo "score2audio Android app built from ${GITHUB_SHA} (version ${VERSION})." > README.md
          git init -q -b builds
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Android app built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.version.outputs.version }}
    concurrency:
      group: release-v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # the release was made on GitHub's website: add the downloads to it
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            PRE=""
            if [[ "$TAG" == *-* ]]; then PRE="--prerelease"; fi
            NOTES=""
            if [ -f "$GITHUB_WORKSPACE/release-notes/$TAG.md" ]; then NOTES="--notes-file $GITHUB_WORKSPACE/release-notes/$TAG.md"; else NOTES="--generate-notes"; fi
            # Creates the tag too, on the commit that was built.
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $PRE \
              --title "score2audio $TAG" $NOTES
          fi
